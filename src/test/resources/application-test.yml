server:
  port: 0

spring:
  application:
    name: sports-settlement-service-test
  datasource:
    url: jdbc:h2:mem:sporty_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  kafka:
    consumer:
      auto-offset-reset: earliest
      group-id: test-settlement-group

app:
  security:
    auth-token: ""
  kafka:
    # Tests provide their own broker via @EmbeddedKafka
    embedded:
      enabled: false
    topics:
      event-outcomes: event-outcomes
  rocketmq:
    enabled: false
    topics:
      bet-settlements: bet-settlements
  outbox:
    enabled: true
    poll-interval-ms: 200
    batch-size: 50
    max-retries: 3
  logging:
    loki:
      enabled: false
    audit:
      max-in-memory-entries: 500
